<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — BuildAbo Construction & Interiors</title>
    <meta
      name="description"
      content="Selected residential and commercial projects by BuildAbo — villas, apartments, kitchens, bathrooms, offices and retail spaces."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="main">
        <section class="page-hero">
          <div class="container">
            <p class="eyebrow">Portfolio</p>
            <h1>Built with care.<br />Photographed honestly.</h1>
            <p class="lead">
              A selection of recent work across residential, interior and
              commercial. Every image is from a real BuildAbo project.
            </p>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="projects-grid" id="projectsGrid"></div>
            <div class="loading-msg" id="loadingMsg">Loading projects…</div>
            <div class="loading-msg hidden" id="loadingMore">Loading more projects…</div>
            <div class="projects-footer">
              <h2>Want to see more, or visit a completed project?</h2>
              <a href="contact.html" class="btn-primary">Request the full portfolio</a>
            </div>
          </div>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script src="site.js"></script>
    <script>
      BuildAbo.renderHeader("site-header");
      BuildAbo.renderFooter("site-footer");

      const grid = document.getElementById("projectsGrid");
      const loadingMsg = document.getElementById("loadingMsg");
      const loadingMore = document.getElementById("loadingMore");
      let page = 1;
      let hasMore = true;
      let loading = false;
      let projects = [];

      function cardHtml(p) {
        const sub = [p.location, p.sqft].filter(Boolean).join(" · ");
        return `
          <a href="project.html?id=${encodeURIComponent(p._id)}">
            <div class="thumb"><img src="${p.image}" alt="${p.title}" loading="lazy" /></div>
            <div class="project-meta">
              <div>
                <h2>${p.title}</h2>
                <p class="sub">${sub}</p>
              </div>
            </div>
          </a>`;
      }

      function render() {
        if (!projects.length) {
          grid.innerHTML = "";
          return;
        }
        grid.innerHTML = projects.map(cardHtml).join("");
      }

      function setLoading(isFirstPage, active) {
        if (isFirstPage) {
          loadingMsg.classList.toggle("hidden", !active);
        } else {
          loadingMore.classList.toggle("hidden", !active);
        }
      }

      async function fetchProjects() {
        if (!hasMore || loading) return;
        loading = true;
        const isFirstPage = page === 1;
        setLoading(isFirstPage, true);

        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 15000);
          const res = await fetch(
            `${BuildAbo.API_URL}/projects?page=${page}&limit=6`,
            { signal: controller.signal }
          );
          clearTimeout(timeout);
          const data = await res.json();
          if (data.success && Array.isArray(data.projects) && data.projects.length) {
            projects = isFirstPage ? data.projects : projects.concat(data.projects);
            hasMore = Boolean(data.hasMore);
            page += 1;
            render();
            return;
          }
        } catch (_) {}

        if (isFirstPage && !projects.length) {
          projects = BuildAbo.FALLBACK_PROJECTS.slice();
          hasMore = false;
          render();
        } else {
          hasMore = false;
        }
      }

      function finishLoading() {
        loading = false;
        loadingMsg.classList.add("hidden");
        loadingMore.classList.add("hidden");
      }

      window.addEventListener("scroll", () => {
        if (
          window.innerHeight + window.scrollY >= document.body.offsetHeight - 300 &&
          hasMore &&
          !loading
        ) {
          fetchProjects().finally(finishLoading);
        }
      });

      fetchProjects().finally(finishLoading);
    </script>
  </body>
</html>
