<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — BuildAbo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>
      <main class="main" id="projectMain">
        <div class="loading-msg" style="padding: 8rem 1.5rem">Loading project…</div>
      </main>
      <div id="site-footer"></div>
    </div>

    <div class="lightbox hidden" id="lightbox">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
      <img id="lightboxImg" src="" alt="" />
    </div>

    <script src="site.js"></script>
    <script>
      BuildAbo.renderHeader("site-header");
      BuildAbo.renderFooter("site-footer");

      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const main = document.getElementById("projectMain");

      function render(project) {
        document.title = `${project.title} — BuildAbo`;
        const gallery = Array.isArray(project.gallery) ? project.gallery : [];

        main.innerHTML = `
          <section class="detail-hero">
            <img id="heroImg" src="${project.image}" alt="${project.title}" />
          </section>
          <section class="section">
            <div class="container">
              <p class="eyebrow">${project.category || ""}</p>
              <h1 style="margin-top: 1rem; font-size: clamp(3rem, 6vw, 4.5rem)">${project.title}</h1>
              <div class="detail-facts">
                <div class="detail-fact"><h3>Location</h3><p>${project.location || "—"}</p></div>
              </div>
              <div class="detail-about">
                <h2>About the Project</h2>
                <p>${project.description || "Details coming soon."}</p>
                <div class="detail-fact"><h3>Area</h3><p>${project.sqft ? project.sqft + " sq.ft" : "—"}</p></div>
                <div class="detail-fact"><h3>Year</h3><p>${project.year || "—"}</p></div>
              </div>
              ${
                gallery.length
                  ? `<div class="detail-gallery"><h2>Project Gallery</h2><div class="gallery-grid">${gallery
                      .map((img, i) => `<img src="${img}" alt="${project.title}-${i}" />`)
                      .join("")}</div></div>`
                  : ""
              }
              <div class="detail-cta">
                <div>
                  <h2>Planning something similar?</h2>
                  <p>Let's discuss your project and bring your vision to life.</p>
                </div>
                <a href="contact.html" class="btn-primary" style="padding: 1rem 2rem">Contact Us</a>
              </div>
              <a href="projects.html" class="back-link">← Back to Projects</a>
            </div>
          </section>`;

        const heroImg = document.getElementById("heroImg");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");

        heroImg.addEventListener("click", () => {
          if (window.innerWidth >= 1024) {
            lightboxImg.src = project.image;
            lightboxImg.alt = project.title;
            lightbox.classList.remove("hidden");
          }
        });
        document.getElementById("lightboxClose").onclick = () => lightbox.classList.add("hidden");
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) lightbox.classList.add("hidden");
        });
      }

      async function load() {
        if (!id) {
          main.innerHTML = `<div class="loading-msg" style="padding:8rem 1.5rem"><h2 style="font-size:1.875rem">Project Not Found</h2></div>`;
          return;
        }

        try {
          const res = await fetch(`${BuildAbo.API_URL}/projects/${id}`);
          const data = await res.json();
          if (data.success && data.project) {
            render(data.project);
            return;
          }
        } catch (_) {}

        const fallback = BuildAbo.FALLBACK_PROJECTS.find((p) => String(p._id) === String(id));
        if (fallback) {
          render(fallback);
        } else {
          main.innerHTML = `<div class="loading-msg" style="padding:8rem 1.5rem"><h2 style="font-size:1.875rem">Project Not Found</h2><a class="back-link" href="projects.html">← Back to Projects</a></div>`;
        }
      }

      load();
    </script>
  </body>
</html>
